version: '3.8'

services:
  quiz-app:
    build: .
    container_name: raceexpert-quiz
    restart: always
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PORT=8000
      - BIND_HOST=0.0.0.0
      - TZ=Europe/Kyiv
    env_file:
      - path: .env
        required: false
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
